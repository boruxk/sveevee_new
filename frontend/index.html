<!doctype html>
<html lang="he" dir="rtl" class="sveevee-rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      if (window.location.pathname === '/') {
        var mobileHero = window.matchMedia('(max-width: 640px)').matches;
        var heroPreload = document.createElement('link');

        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = mobileHero
          ? '/assets/landing/hero-mobile-640.v1.avif'
          : '/assets/landing/hero-main-1360.v1.avif';
        heroPreload.setAttribute('imagesrcset', mobileHero
          ? '/assets/landing/hero-mobile-480.v1.avif 480w, /assets/landing/hero-mobile-640.v1.avif 640w, /assets/landing/hero-mobile-720.v1.avif 720w, /assets/landing/hero-mobile-800.v1.avif 800w'
          : '/assets/landing/hero-main-960.v1.avif 960w, /assets/landing/hero-main-1360.v1.avif 1360w');
        heroPreload.setAttribute('imagesizes', mobileHero ? '(max-width: 520px) 100vw, 520px' : '90vw');
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="sveevee" />
    <meta name="theme-color" content="#6f42ff" />
    <meta property="og:site_name" content="sveevee" />
    <title>Sveevee</title>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.__sveeveeLoadAnalytics = function () {
        var analyticsHosts = ['sveevee.co.il', 'www.sveevee.co.il'];
        if (!analyticsHosts.includes(window.location.hostname.toLowerCase())) return;
        if (window.__sveeveeAnalyticsLoaded) return;
        window.__sveeveeAnalyticsLoaded = true;

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-3KT6ET4DTY';
        document.head.appendChild(script);

        gtag('js', new Date());
        gtag('config', 'G-3KT6ET4DTY', { cookie_domain: 'sveevee.co.il' });
      };

      window.addEventListener('load', function () {
        var schedule = window.requestIdleCallback || function (callback) {
          return window.setTimeout(callback, 1);
        };

        schedule(function () {
          window.setTimeout(window.__sveeveeLoadAnalytics, 5000);
        });
      }, { once: true });

      ['pointerdown', 'keydown', 'touchstart'].forEach(function (eventName) {
        window.addEventListener(eventName, window.__sveeveeLoadAnalytics, { once: true, passive: true });
      });
    </script>
  </head>
  <body>
    <noscript>
      <p>יש להפעיל JavaScript כדי להשתמש ב-Sveevee.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
