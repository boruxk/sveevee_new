# Include once at server scope in the existing HTTPS website vhost, before
# broader regex locations. Review docs/seo-public-pages.md before installation.
# Paths and upstream verified read-only in /etc/nginx/sites-enabled/sveevee
# on 2026-09-16. Recheck them if the website's release layout or PHP pool changes.

location = / {
    include /etc/nginx/snippets/sveevee-public-html-fastcgi.conf;
}

location ~ ^/(?:(?:he|en|ru|fr)/)?(?:business|community|product|pages)/[^/]+/?$ {
    include /etc/nginx/snippets/sveevee-public-html-fastcgi.conf;
}
