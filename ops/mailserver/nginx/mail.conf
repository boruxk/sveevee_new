server {
    listen 80;
    listen [::]:80;
    server_name mail.sveevee.co.il webmail.sveevee.co.il mta-sts.sveevee.co.il autoconfig.sveevee.co.il;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mail-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmail.sveevee.co.il mail.sveevee.co.il;

    root /var/lib/roundcube/public_html;
    index index.php;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/mail.sveevee.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sveevee.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:config|temp|logs|installer)/ {
        deny all;
    }

    location ~ \.php(?:/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.sveevee.co.il;

    ssl_certificate /etc/letsencrypt/live/mail.sveevee.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sveevee.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;

    location = /.well-known/mta-sts.txt {
        root /var/www/mta-sts;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoconfig.sveevee.co.il;

    ssl_certificate /etc/letsencrypt/live/mail.sveevee.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sveevee.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;

    location = /mail/config-v1.1.xml {
        root /var/www/autoconfig;
        default_type application/xml;
    }

    location / {
        return 404;
    }
}

